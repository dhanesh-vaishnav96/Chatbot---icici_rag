<!DOCTYPE html>
<html>

<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded-xl shadow">
        <h1 class="text-2xl font-bold mb-4">ICICI Chatbot</h1>

        <form method="post" action="/chat">
            <input name="message" class="w-full border p-2 rounded" placeholder="Ask question">
            <button class="mt-2 bg-blue-500 text-white px-4 py-2 rounded">Send</button>
        </form>

        {% if message %}
        <div class="mt-4">
            <p class="font-bold">You:</p>
            <p>{{message}}</p>
        </div>

        <div class="mt-2">
            <p class="font-bold">Bot:</p>
            <p>{{answer}}</p>
        </div>
        {% endif %}
    </div>

</body>

</html>
